<script>
let sessionToken='',missions=[],requestId='';const $=id=>document.getElementById(id);
const call=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
document.addEventListener('DOMContentLoaded',()=>$('missionForm').addEventListener('submit',send));
async function connect(){setBusy(true);try{const r=await call('login',$('driver').value,$('pin').value);sessionToken=r.token;$('pin').value='';$('driverName').textContent=r.driver;$('login').classList.add('hidden');$('formPanel').classList.remove('hidden');await refresh();}catch(e){$('loginError').textContent=e.message;}finally{setBusy(false);}}
async function refresh(){try{missions=await call('listMissions',sessionToken);$('missionId').replaceChildren();for(const m of missions){const o=document.createElement('option');o.value=m.id;o.textContent=m.date+' '+m.time+' — '+m.from+' → '+m.to;$('missionId').append(o);}selectMission();$('submitBtn').disabled=!missions.length;$('loadError').textContent=missions.length?'':'Aucune mission attribuée disponible.';const items=await call('history',sessionToken);$('history').replaceChildren();for(const r of items){const p=document.createElement('p');p.textContent=r.date+' — '+r.start+' → '+r.end+' — '+r.km+' km — Incident : '+r.incident;$('history').append(p);}}catch(e){$('loadError').textContent=e.message;$('submitBtn').disabled=true;}}
function selectMission(){const m=missions.find(m=>m.id===$('missionId').value);$('routeDate').value=m?m.date:'';$('endDate').value=m?m.date:'';requestId=crypto.randomUUID();}
async function logout(){const token=sessionToken;sessionToken='';missions=[];$('missionForm').reset();$('missionId').replaceChildren();$('history').replaceChildren();$('formPanel').classList.add('hidden');$('success').classList.add('hidden');$('login').classList.remove('hidden');try{await call('logout',token);}catch(e){}}
async function send(e){e.preventDefault();$('submitBtn').disabled=true;$('formError').textContent='';try{const f=$('proof').files[0];if(f&&f.size>5242880)throw Error('Maximum 5 Mo.');const p={token:sessionToken,requestId,missionId:$('missionId').value,incident:$('incident').checked,comment:$('comment').value};for(const k of ['routeDate','endDate','start','end','kmStart','kmEnd','litres','fuel'])p[k]=$(k).value;p.proof=f?{data:await toDataUrl(f),mime:f.type}:null;await call('submitMission',p);$('formPanel').classList.add('hidden');$('success').classList.remove('hidden');}catch(e){$('formError').textContent=e.message;}finally{$('submitBtn').disabled=false;}}
async function newEntry(){$('missionForm').reset();$('success').classList.add('hidden');$('formPanel').classList.remove('hidden');await refresh();}
function toDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
function setBusy(v){document.querySelector('#login button').disabled=v;}
</script>
