<style>
:root{--blue:#17365d;--light:#eef4f8;--red:#b42318;--green:#137333}*{box-sizing:border-box}body{margin:0;background:var(--light);font-family:Arial,sans-serif;color:#1f2937}.shell{max-width:680px;margin:auto;padding:18px}header{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.mark{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:800}h1{margin:0;color:var(--blue);font-size:24px}header p{margin:2px 0 0;color:#667085}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #17365d18;margin-bottom:18px}h2{margin:0 0 18px;color:var(--blue)}label{display:block;font-weight:700;font-size:14px;margin:0 0 15px}input,textarea{display:block;width:100%;margin-top:7px;border:1px solid #cbd5e1;border-radius:10px;padding:13px;font:inherit;background:#fff}input:focus,textarea:focus{outline:3px solid #bed7ee;border-color:var(--blue)}button{width:100%;border:0;border-radius:11px;padding:14px;background:var(--blue);color:white;font-weight:800;font-size:16px;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{grid-template-columns:repeat(3,1fr)}.check{display:flex;align-items:center;gap:10px;background:#fff5f4;border-radius:10px;padding:12px}.check input{width:22px;height:22px;margin:0}.welcome{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.link{width:auto;background:transparent;color:var(--blue);padding:6px}.hidden{display:none}.error{color:var(--red);font-weight:700}.success{text-align:center}.tick{margin:auto auto 12px;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#e6f4ea;color:var(--green);font-size:32px;font-weight:900}@media(max-width:520px){.grid,.three{grid-template-columns:1fr}.card{padding:18px}.shell{padding:12px}}
</style>
