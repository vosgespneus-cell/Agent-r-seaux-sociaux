name: Runtime safety tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q src runtime installer tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check PHP readiness guard
        run: |
          php -l lws/vp_readiness.php
          php lws/vp_readiness.php --selftest
